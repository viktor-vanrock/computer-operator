podAnnotations:
  vault.hashicorp.com/agent-inject-secret-config: 'rndml/computer-operator-back-dev'
  vault.hashicorp.com/agent-inject-template-config: |
    {{- with secret "rndml/computer-operator-back-dev" -}}
    {{ range $k, $v := .Data.data }}export {{ $k }}={{ $v }}
    {{ end }}{{- end -}}

ingress:
  hosts:
    - host: computer-operator.dev.mlrnd.ru
      paths:
        - path: /api(/|$)(.*)
          pathType: ImplementationSpecific
          port: 3001
  tls:
    - secretName: computer-operator
      hosts: [computer-operator.dev.mlrnd.ru]

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
