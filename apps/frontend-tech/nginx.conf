server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    gzip on;
    gzip_types text/html application/javascript application/json text/css;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA fallback — всё что не файл отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /guacamole/ {
        proxy_pass https://guacamole.devops.mlrnd.ru/guacamole/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host guacamole.devops.mlrnd.ru;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;  # рекомендация Guacamole для туннеля
    }

    # Кэширование статических ассетов
    location ~* \.(?:css|js|jpg|svg|jpeg|png|ico|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
